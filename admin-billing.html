<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Summary</title>
  <link rel="stylesheet" href="css/admin-billing.css" />
</head>
<body>
  <div class="billing-container">
    <h2>Billing Summary</h2>

    <table>
      <thead>
        <tr>
          <th>User Name</th>
          <th>Payment Method</th>
          <th>Delivered On</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="billingTable"></tbody>
    </table>

    <div class="total-revenue">
      <h3>Total Revenue: ₹<span id="totalRevenue">0</span></h3>
    </div>
  </div>

  <script type="module" src="js/admin-billing.js"></script>
</body>
</html>
