<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Registration - Gas Booking</title>
  <link rel="stylesheet" href="css/register.css" />
</head>
<body>
  <div class="register-container">
    <div class="register-box">
      <h2>User Registration</h2>
      <form id="registerForm">
        <input type="text" id="name" placeholder="Full Name" required /><br>
        <input type="text" id="userId" placeholder="User ID" required /><br>
        <input type="email" id="email" placeholder="Email" required /><br>
        <input type="text" id="phone" placeholder="Phone Number" required /><br>
        <input type="text" id="address" placeholder="Address" required /><br>
        <input type="password" id="password" placeholder="Password" required /><br>
        <button type="submit">Register</button>
      </form>
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
